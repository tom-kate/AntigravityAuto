<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AntiAuto - 系统设置</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  * { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-[#0d1117] min-h-screen text-[13px] text-[#c9d1d9]">
<div id="app" class="flex flex-col h-screen">

  <!-- Top Bar -->
  <header class="h-14 bg-[#161b22] border-b border-[#30363d] flex items-center justify-between px-6 shrink-0 sticky top-0 z-40">
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <span class="text-[#e6edf3] font-bold text-[15px] tracking-wide select-none">AntiAuto</span>
      </div>
      <nav class="flex bg-[#0d1117] border border-[#30363d] rounded-lg p-0.5">
        <a href="/" class="px-4 py-1.5 rounded-md text-[12px] font-medium text-[#8b949e] hover:text-[#c9d1d9] transition">账号管理</a>
        <a href="/settings.html" class="px-4 py-1.5 rounded-md text-[12px] font-medium bg-[#21262d] text-[#e6edf3]">设置</a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <span v-if="saved" class="text-[11px] text-[#3fb950] bg-[#3fb95015] border border-[#3fb95030] px-2.5 py-1 rounded-md font-medium animate-pulse">已保存</span>
      <span class="text-[11px] text-[#484f58]">修改后自动热重载, 无需重启</span>
    </div>
  </header>

  <!-- Main -->
  <div class="flex-1 overflow-y-auto">
      <div class="max-w-[680px] mx-auto p-8 space-y-6" v-if="loaded">

        <!-- Browser -->
        <div class="bg-[#161b22] rounded-xl border border-[#30363d] p-6 space-y-5">
          <div class="flex items-center gap-2 mb-1">
            <svg class="w-4 h-4 text-[#58a6ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <span class="text-[#e6edf3] font-semibold text-[14px]">浏览器</span>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">代理地址</label>
              <input v-model="form.proxy" :disabled="!form.proxy_enabled" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition disabled:opacity-40 disabled:cursor-not-allowed" placeholder="http://127.0.0.1:10808">
            </div>
            <div>
              <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">Web 端口</label>
              <input v-model.number="form.port" type="number" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" placeholder="8080">
              <p class="text-[10px] text-[#484f58] mt-1">修改端口后需重启程序</p>
            </div>
          </div>
          <div class="flex items-center justify-between bg-[#0d1117] border border-[#30363d] rounded-lg px-4 py-3.5">
            <div>
              <div class="text-[#e6edf3] text-[13px] font-medium">启用代理</div>
              <div class="text-[11px] text-[#8b949e] mt-0.5">开启后浏览器通过代理地址访问网络</div>
            </div>
            <button @click="form.proxy_enabled=!form.proxy_enabled" class="relative w-11 h-6 rounded-full transition-colors duration-200 focus:outline-none"
                    :class="form.proxy_enabled?'bg-[#1f6feb]':'bg-[#30363d]'">
              <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-200"
                    :class="form.proxy_enabled?'translate-x-5':'translate-x-0'"></span>
            </button>
          </div>
          <div class="flex items-center justify-between bg-[#0d1117] border border-[#30363d] rounded-lg px-4 py-3.5">
            <div>
              <div class="text-[#e6edf3] text-[13px] font-medium">无头浏览器模式</div>
              <div class="text-[11px] text-[#8b949e] mt-0.5">开启后浏览器在后台运行, 不显示窗口</div>
            </div>
            <button @click="form.headless=!form.headless" class="relative w-11 h-6 rounded-full transition-colors duration-200 focus:outline-none"
                    :class="form.headless?'bg-[#1f6feb]':'bg-[#30363d]'">
              <span class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-200"
                    :class="form.headless?'translate-x-5':'translate-x-0'"></span>
            </button>
          </div>
          <div>
            <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">全局并发数</label>
            <div class="flex items-center gap-3">
              <input v-model.number="form.concurrency" type="number" min="1" max="20" class="w-20 bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition text-center">
              <p class="text-[10px] text-[#484f58]">同时处理的子号数量，跨所有批次共享</p>
            </div>
          </div>
        </div>

        <!-- CPA -->
        <div class="bg-[#161b22] rounded-xl border border-[#30363d] p-6 space-y-5">
          <div class="flex items-center gap-2 mb-1">
            <svg class="w-4 h-4 text-[#3fb950]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <span class="text-[#e6edf3] font-semibold text-[14px]">CPA 配置</span>
          </div>
          <div class="space-y-4">
            <div>
              <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">API 地址</label>
              <input v-model="form.cpa_api_url" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" placeholder="http://103.30.76.230:8317">
            </div>
            <div>
              <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">Token</label>
              <input v-model="form.cpa_token" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" placeholder="your-token">
            </div>
          </div>
        </div>

        <!-- SMS -->
        <div class="bg-[#161b22] rounded-xl border border-[#30363d] p-6 space-y-5">
          <div class="flex items-center gap-2 mb-1">
            <svg class="w-4 h-4 text-[#d29922]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            <span class="text-[#e6edf3] font-semibold text-[14px]">短信平台</span>
          </div>
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">API 用户名</label>
                <input v-model="form.sms_username" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" placeholder="API Username">
              </div>
              <div>
                <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">API 密码</label>
                <input v-model="form.sms_password" type="password" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" placeholder="API Password">
              </div>
            </div>
            <div>
              <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">频道 ID (对接码)</label>
              <div class="space-y-2">
                <div v-for="(ch, i) in form.sms_channel_ids" :key="i" class="flex items-center gap-2">
                  <span class="text-[11px] text-[#484f58] w-4 text-right shrink-0">{{i+1}}</span>
                  <input v-model="form.sms_channel_ids[i]" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" :placeholder="'频道 '+(i+1)">
                </div>
              </div>
              <p class="text-[10px] text-[#484f58] mt-1">获取手机号时从频道 1 开始，失败则自动切换下一个频道</p>
            </div>
          </div>
        </div>

        <!-- Age Verification / Credit Card -->
        <div class="bg-[#161b22] rounded-xl border border-[#30363d] p-6 space-y-5">
          <div class="flex items-center gap-2 mb-1">
            <svg class="w-4 h-4 text-[#bc8cff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
            <span class="text-[#e6edf3] font-semibold text-[14px]">年龄验证 (信用卡)</span>
          </div>
          <p class="text-[11px] text-[#8b949e]">额度异常时自动使用信用卡完成 Google 年龄验证, 不会产生实际扣费</p>
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">卡号</label>
                <input v-model="form.card_number" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" placeholder="4242424242424242" inputmode="numeric">
              </div>
              <div>
                <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">有效期</label>
                <input v-model="form.card_expiry" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" placeholder="MM/YY" inputmode="numeric">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">安全码 (CVV)</label>
                <input v-model="form.card_cvv" type="password" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" placeholder="123" inputmode="numeric">
              </div>
              <div>
                <label class="block text-[11px] text-[#8b949e] mb-1.5 uppercase tracking-wider font-medium">账单邮编</label>
                <input v-model="form.card_zip" class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2.5 text-[13px] text-[#c9d1d9] font-mono placeholder-[#484f58] focus:outline-none focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff30] transition" placeholder="10001" inputmode="numeric">
              </div>
            </div>
          </div>
        </div>

        <!-- Save -->
        <div class="flex justify-end">
          <button @click="saveConfig" :disabled="saving" class="bg-[#238636] hover:bg-[#2ea043] disabled:opacity-40 disabled:cursor-not-allowed text-white text-[13px] font-medium px-6 py-2.5 rounded-lg transition">
            {{saving?'保存中...':'保存配置'}}
          </button>
        </div>

      </div>
      <div v-else class="flex items-center justify-center h-full text-[#484f58]">加载中...</div>
    </div>
  </div>



</div>

<script src="/js/settings.js"></script>
</body>
</html>
